global:
  scrape_interval: 15s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: robotreplay
    static_configs: [{targets: ["app:8000"]}]
    authorization:
      credentials_file: /var/lib/robotreplay/metrics-token
  - job_name: otelcol
    static_configs: [{targets: ["otelcol:8888"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: vllm
    static_configs: [{targets: ["vllm:8000"]}]
  - job_name: dcgm
    static_configs: [{targets: ["host.docker.internal:9400"]}]
