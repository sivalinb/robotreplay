[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robotreplay"
version = "0.2.0"
description = "Evidence-first robotics practice review, with observable and bounded AI."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "imageio-ffmpeg>=0.5,<1",
  "opentelemetry-sdk>=1.29,<2", "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "prometheus-client>=0.21,<1", "python-multipart>=0.0.20,<1", "langgraph>=0.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pip-audit>=2.7,<3"]
nemo = ["nemoguardrails>=0.20,<1"]

[project.scripts]
robotreplay = "robotreplay.cli:main"

[tool.setuptools.package-data]
robotreplay = ["static/*", "data/*.json", "rails/*"]

[tool.setuptools.packages.find]
include = ["robotreplay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
