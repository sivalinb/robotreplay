name: robotreplay
services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      RR_DATA_DIR: /var/lib/robotreplay
      RR_ALLOWED_HOSTS: localhost,127.0.0.1,app
    volumes: ["replay-data:/var/lib/robotreplay"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    user: "10001:10001"
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/tmp/prometheus", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - replay-data:/var/lib/robotreplay:ro
  grafana:
    image: grafana/grafana:13.2.0
    profiles: ["observability"]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-lab-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.160.0
    profiles: ["observability"]
    user: "10001:10001"
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./ops/otelcol.yml:/etc/otelcol/config.yml:ro
      - replay-data:/var/lib/robotreplay:ro
  tempo:
    image: grafana/tempo:2.10.8
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./ops/tempo.yml:/etc/tempo.yml:ro"]
  loki:
    image: grafana/loki:3.7.7
    profiles: ["observability"]
    command: ["-config.file=/etc/loki.yml"]
    volumes: ["./ops/loki.yml:/etc/loki.yml:ro"]
  vllm:
    image: vllm/vllm-openai:v0.23.0
    profiles: ["gpu"]
    ports: ["127.0.0.1:8001:8000"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - "--model"
      - "${RR_GPU_MODEL:-}"
      - "--max-model-len"
      - "${RR_GPU_CONTEXT:-8192}"
      - "--gpu-memory-utilization"
      - "0.75"
      - "--enable-prefix-caching"
    shm_size: 2gb
    volumes: ["model-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  replay-data:
  grafana-data:
  model-cache:
